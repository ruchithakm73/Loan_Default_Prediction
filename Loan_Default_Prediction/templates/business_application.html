<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Business Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="form-page-bg">

<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        <div class="navbar-nav ms-auto align-items-center gap-3">
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container form-section">
    <div class="glass-card mx-auto" style="max-width:1000px; padding:28px;">
        <h3 class="text-white mb-3">Business Loan Application</h3>
        <p class="text-light small">Please fill out the form below. Fields marked with * are required.</p>

        <form method="POST" enctype="multipart/form-data" onsubmit="return validateApplicationForm(this)" novalidate>
            <!-- Personal Details -->
            <div class="mb-4">
                <h5 class="text-white">Personal Details</h5>
                <div class="row g-3 mt-2">
                    <div class="col-md-6">
                        <label class="form-label text-light">Full Name *</label>
                        <input type="text" name="full_name" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Mobile Number *</label>
                        <input type="tel" name="mobile" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Email ID *</label>
                        <input type="email" name="email" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Date of Birth</label>
                        <input type="date" name="dob" class="form-control custom-input">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Address *</label>
                        <textarea name="address" class="form-control custom-input" rows="2" required></textarea>
                    </div>
                </div>
            </div>

            <!-- Business Details -->
            <div class="mb-4">
                <h5 class="text-white">Business Details</h5>
                <div class="row g-3 mt-2">
                    <div class="col-md-6">
                        <label class="form-label text-light">Business Name *</label>
                        <input type="text" name="business_name" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Business Type *</label>
                        <select name="business_type" class="form-control custom-input" required>
                            <option value="">Select</option>
                            <option>Proprietorship</option>
                            <option>Partnership</option>
                            <option>Private Limited</option>
                            <option>Public Limited</option>
                            <option>LLP</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Business Address *</label>
                        <textarea name="business_address" class="form-control custom-input" rows="2" required></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Years of Business *</label>
                        <input type="number" min="0" name="years_in_business" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">GST Number</label>
                        <input type="text" name="gst_number" class="form-control custom-input">
                    </div>
                </div>
            </div>

            <!-- Income Details -->
            <div class="mb-4">
                <h5 class="text-white">Income Details</h5>
                <div class="row g-3 mt-2">
                    <div class="col-md-4">
                        <label class="form-label text-light">Monthly Income (₹)</label>
                        <input type="number" step="0.01" name="monthly_income" class="form-control custom-input">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Annual Turnover (₹)</label>
                        <input type="number" step="0.01" name="annual_turnover" class="form-control custom-input">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Profit Details (₹)</label>
                        <input type="number" step="0.01" name="profit_details" class="form-control custom-input">
                    </div>
                </div>
            </div>

            <!-- Loan Details -->
            <div class="mb-4">
                <h5 class="text-white">Loan Details</h5>
                <div class="row g-3 mt-2">
                    <div class="col-md-4">
                        <label class="form-label text-light">Loan Amount Needed (₹) *</label>
                        <input type="number" step="0.01" name="loan_amount_needed" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Purpose of Loan *</label>
                        <input type="text" name="purpose_of_loan" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Loan Tenure (months)</label>
                        <input type="number" min="1" name="loan_tenure" class="form-control custom-input">
                    </div>
                </div>
            </div>

            <!-- Bank Details -->
            <div class="mb-4">
                <h5 class="text-white">Bank Details</h5>
                <div class="row g-3 mt-2">
                    <div class="col-md-4">
                        <label class="form-label text-light">Bank Name</label>
                        <input type="text" name="bank_name" class="form-control custom-input">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Account Number</label>
                        <input type="text" name="account_number" class="form-control custom-input">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">IFSC Code</label>
                        <input type="text" name="ifsc_code" class="form-control custom-input">
                    </div>
                </div>
            </div>

            <!-- Documents Upload -->
            <div class="mb-4">
                <h5 class="text-white">Documents Upload</h5>
                <p class="text-light small">Upload clear copies (PDF/JPG/PNG). Maximum one file per field.</p>
                <div class="row g-3 mt-2">
                    <div class="col-md-6">
                        <label class="form-label text-light">Aadhaar Card</label>
                        <input type="file" name="aadhaar_card" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">PAN Card</label>
                        <input type="file" name="pan_card" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Passport Size Photo</label>
                        <input type="file" name="photo" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Bank Statement</label>
                        <input type="file" name="bank_statement" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">GST Certificate</label>
                        <input type="file" name="gst_certificate" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Business License</label>
                        <input type="file" name="business_license" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">ITR Documents</label>
                        <input type="file" name="itr_documents" class="form-control custom-input">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Address Proof</label>
                        <input type="file" name="address_proof" class="form-control custom-input">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="/dashboard" class="btn btn-outline-light">Cancel</a>
                <button type="submit" class="btn btn-glow">Submit Application</button>
            </div>
        </form>
    </div>
</div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
