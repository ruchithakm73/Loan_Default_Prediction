<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicle Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="form-page-bg">

<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        <div class="navbar-nav ms-auto align-items-center gap-3">
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container" style="padding-top:110px; padding-bottom:60px;">
    <div class="glass-card p-4 mx-auto" style="max-width:900px;">
        <h3 class="text-white mb-3">Vehicle Loan Application</h3>
        <p class="text-light">Complete the form below and upload the required documents.</p>

        <form action="/apply/vehicle" method="POST" enctype="multipart/form-data" onsubmit="return validateApplicationForm(this)" novalidate>
            <!-- Personal Details -->
            <h5 class="text-white mt-3">Personal Details</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-white">Full Name</label>
                    <input type="text" name="full_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Date of Birth</label>
                    <input type="date" name="dob" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Mobile Number</label>
                    <input type="tel" name="mobile" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Email ID</label>
                    <input type="email" name="email" class="form-control custom-input" required>
                </div>
                <div class="col-12">
                    <label class="text-white">Address</label>
                    <textarea name="address" class="form-control custom-input" rows="2" required></textarea>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Bank Account Number</label>
                    <input type="text" name="bank_account" class="form-control custom-input" required>
                </div>
            </div>

            <!-- ID Proof -->
            <h5 class="text-white mt-4">ID Proof</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="text-white">Aadhaar Number</label>
                    <input type="text" name="aadhaar" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">PAN Number</label>
                    <input type="text" name="pan" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Driving License Number</label>
                    <input type="text" name="driving_license" class="form-control custom-input" required>
                </div>
            </div>

            <!-- Vehicle Details -->
            <h5 class="text-white mt-4">Vehicle Details</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="text-white">Vehicle Type</label>
                    <select name="vehicle_type" class="form-control custom-input" required>
                        <option value="">Select type</option>
                        <option value="Bike">Bike</option>
                        <option value="Car">Car</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Brand & Model</label>
                    <input type="text" name="brand_model" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Vehicle Price (₹)</label>
                    <input type="number" name="vehicle_price" step="0.01" class="form-control custom-input" required>
                </div>

                <div class="col-md-6">
                    <label class="text-white">Vehicle Condition</label>
                    <select name="vehicle_condition" class="form-control custom-input" required>
                        <option value="">Select condition</option>
                        <option value="New">New</option>
                        <option value="Used">Used</option>
                    </select>
                </div>
            </div>

            <!-- Documents Upload -->
            <h5 class="text-white mt-4">Documents Upload</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="text-white">Aadhaar Card</label>
                    <input type="file" name="aadhaar_card" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">PAN Card</label>
                    <input type="file" name="pan_card" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Passport Size Photo</label>
                    <input type="file" name="photo" accept="image/*" class="form-control custom-input" required>
                </div>

                <div class="col-md-4">
                    <label class="text-white">Address Proof</label>
                    <input type="file" name="address_proof" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Driving License</label>
                    <input type="file" name="driving_license_doc" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Vehicle Quotation / Invoice</label>
                    <input type="file" name="vehicle_quotation" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
            </div>

            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-glow">Submit Vehicle Loan Application</button>
                <a href="/loan_selection" class="btn btn-outline-light ms-2">Cancel</a>
            </div>
        </form>

    </div>
</div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
