<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Loan Default Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="form-page-bg">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="hero-section d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="glass-card p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-white fw-bold">Create Account</h2>
                            <p class="text-light">Join LoanPredict today</p>
                        </div>

                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form action="/register" method="POST">
                            <div class="mb-3">
                                <label class="text-white form-label">Username</label>
                                <input type="text" name="username" class="form-control custom-input" placeholder="Enter your username" required>
                            </div>

                            <div class="mb-3">
                                <label class="text-white form-label">Password</label>
                                <input type="password" name="password" class="form-control custom-input" placeholder="Enter your password" required>
                            </div>

                            <div class="mb-3">
                                <label class="text-white form-label">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control custom-input" placeholder="Confirm your password" required>
                            </div>

                            <button type="submit" class="btn btn-glow btn-lg w-100 mb-3">
                                Register
                            </button>

                            <div class="text-center">
                                <p class="text-light mb-0">Already have an account? 
                                    <a href="/" class="text-white fw-bold text-decoration-none">Login here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
