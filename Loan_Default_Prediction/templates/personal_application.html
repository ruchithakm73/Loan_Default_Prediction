<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="form-page-bg">

<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        <div class="navbar-nav ms-auto align-items-center gap-3">
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container form-section">
    <div class="glass-card p-4 mx-auto" style="max-width:1000px;">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h3 class="text-white mb-1">Personal Loan Application</h3>
                <p class="text-light small mb-0">Complete the form below to apply for a personal loan.</p>
            </div>
            <div class="text-end">
                <a href="/loan_selection" class="btn btn-outline-light">Back</a>
            </div>
        </div>

        <form action="/apply/personal" method="POST" enctype="multipart/form-data" onsubmit="return validateApplicationForm(this)" novalidate>
            <!-- Personal Details -->
            <section class="mb-4">
                <h5 class="text-white mb-3">Personal Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="text-white">Full Name</label>
                        <input type="text" name="full_name" class="form-control custom-input" placeholder="As on ID" required value="{{ prefill.full_name if prefill and prefill.full_name is defined else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="text-white">Date of Birth</label>
                        <input type="date" name="dob" class="form-control custom-input" required value="{{ prefill.dob if prefill and prefill.dob is defined else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="text-white">Mobile Number</label>
                        <input type="tel" name="mobile" class="form-control custom-input" placeholder="+91xxxxxxxxxx" required value="{{ prefill.mobile if prefill and prefill.mobile is defined else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="text-white">Email ID</label>
                        <input type="email" name="email" class="form-control custom-input" placeholder="you@example.com" required value="{{ prefill.email if prefill and prefill.email is defined else '' }}">
                    </div>
                    <div class="col-12">
                        <label class="text-white">Address</label>
                        <textarea name="address" rows="3" class="form-control custom-input" placeholder="Current residential address" required>{{ prefill.address if prefill and prefill.address is defined else '' }}</textarea>
                    </div>
                </div>
            </section>

            <!-- ID Details -->
            <section class="mb-4">
                <h5 class="text-white mb-3">ID Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="text-white">Aadhaar Number</label>
                        <input type="text" name="aadhaar" class="form-control custom-input" placeholder="xxxx xxxx xxxx" inputmode="numeric" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">PAN Number</label>
                        <input type="text" name="pan" class="form-control custom-input" placeholder="ABCDE1234F" required>
                    </div>
                </div>
            </section>

            <!-- Bank Details -->
            <section class="mb-4">
                <h5 class="text-white mb-3">Bank Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="text-white">Bank Name</label>
                        <input type="text" name="bank_name" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">Account Number</label>
                        <input type="text" name="account_number" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">IFSC Code</label>
                        <input type="text" name="ifsc" class="form-control custom-input" placeholder="e.g. HDFC0000123" required>
                    </div>
                </div>
            </section>

            <!-- Documents Upload -->
            <section class="mb-4">
                <h5 class="text-white mb-3">Documents Upload</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="text-white">Aadhaar Card (front/back)</label>
                        <input type="file" name="aadhaar_file" accept="image/*,application/pdf" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">PAN Card</label>
                        <input type="file" name="pan_file" accept="image/*,application/pdf" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">Passport Size Photo</label>
                        <input type="file" name="photo" accept="image/*" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-white">Address Proof (Utility bill / Passport / Driving Licence)</label>
                        <input type="file" name="address_proof" accept="image/*,application/pdf" class="form-control custom-input" required>
                    </div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <div class="text-muted small">By submitting, you agree to our terms and privacy policy.</div>
                <div>
                    <button type="submit" class="btn btn-glow">Submit Application</button>
                    <a href="/loan_selection" class="btn btn-outline-light ms-2">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
