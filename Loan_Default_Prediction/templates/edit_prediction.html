<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="form-page-bg">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        <div class="navbar-nav ms-auto align-items-center gap-3">
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<!-- Form Section -->
<section class="form-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="glass-card p-5">

                    <div class="text-center mb-4">
                        <h2 class="text-white fw-bold">Edit Prediction</h2>
                        <p class="text-light">Update applicant details and re-run prediction</p>
                        {% if error %}
                            <div class="alert alert-danger mt-3">{{ error }}</div>
                        {% endif %}
                    </div>

                    <form action="/update_prediction/{{ pred.id }}" method="POST" onsubmit="return validatePredictForm(this)" novalidate>

                        <div class="row g-4">

                            <div class="col-md-6">
                                <label class="text-white">Full Name</label>
                                <input type="text" name="name" class="form-control custom-input" required value="{{ pred.name }}">
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Gender</label>
                                <select name="gender" class="form-control custom-input" required>
                                    <option value="">Select gender</option>
                                    <option value="Male" {% if pred.gender == 'Male' %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if pred.gender == 'Female' %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if pred.gender == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Age</label>
                                <input type="number" name="age" min="18" step="1" class="form-control custom-input" required value="{{ pred.age }}">
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Annual Income</label>
                                <input type="text" name="annual_income" min="0" step="0.01" class="form-control custom-input" required value="{(pred.annual_income) }}">
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Loan Amount</label>
                                <input type="number" name="loan_amount" min="0" step="0.01" class="form-control custom-input" required value="{{ pred.loan_amount }}">
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Credit Score</label>
                                <input type="number" name="credit_score" min="0" step="1" class="form-control custom-input" required value="{{ pred.credit_score }}">
                            </div>

                            <div class="col-md-6">
                                <label class="text-white">Employment Status</label>
                                <select name="employment_status" class="form-control custom-input" required>
                                    <option value="">Select employment status</option>
                                    <option value="Salaried" {% if ('employment_status' in pred.keys() and (pred['employment_status'] if 'employment_status' in pred.keys() else '') ) == 'Salaried' %}selected{% endif %}>Salaried</option>
                                    <option value="Self-Employed" {% if ('employment_status' in pred.keys() and (pred['employment_status'] if 'employment_status' in pred.keys() else '') ) == 'Self-Employed' %}selected{% endif %}>Self-Employed</option>
                                    <option value="Student" {% if ('employment_status' in pred.keys() and (pred['employment_status'] if 'employment_status' in pred.keys() else '') ) == 'Student' %}selected{% endif %}>Student</option>
                                    <option value="Unemployed" {% if ('employment_status' in pred.keys() and (pred['employment_status'] if 'employment_status' in pred.keys() else '') ) == 'Unemployed' %}selected{% endif %}>Unemployed</option>
                                </select>
                            </div>

                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-glow btn-lg px-5">
                                    Update Prediction
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>
</section>

<!-- Loader -->
<div id="loader" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:white;
    justify-content:center;
    align-items:center;
    z-index:9999;
">
    <h2>Loading...</h2>
</div>

<!-- JS -->
<script>
function showLoader() {
    document.getElementById("loader").style.display = "flex";
}

function validatePredictForm(form) {
    const nameEl = form.querySelector('[name="name"]');
    const ageEl = form.querySelector('[name="age"]');

    function clearField(el) {
        if (!el) return;
        el.classList.remove('input-invalid');
        const err = el.parentNode.querySelector('.field-error');
        if (err) err.textContent = '';
    }

    function showError(el, msg) {
        if (!el) return;
        clearField(el);
        el.classList.add('input-invalid');
        let err = el.parentNode.querySelector('.field-error');
        if (!err) {
            err = document.createElement('div');
            err.className = 'field-error';
            el.parentNode.appendChild(err);
        }
        err.textContent = msg;
        el.focus();
    }

    // Clear previous errors
    clearField(nameEl);
    clearField(ageEl);

    let valid = true;

    // Name: start with capital, letters and spaces only
    const nameVal = nameEl ? nameEl.value.trim() : '';
    if (!/^[A-Z][A-Za-z ]+$/.test(nameVal)) {
        showError(nameEl, 'Full Name must start with a capital letter and contain only letters and spaces.');
        valid = false;
    }

    // Age: exactly 2 digits, between 18 and 60
    const ageVal = ageEl ? ageEl.value.toString().trim() : '';
    if (!/^\d{2}$/.test(ageVal)) {
        showError(ageEl, 'Age must contain exactly 2 digits.');
        valid = false;
    } else {
        const ageNum = parseInt(ageVal, 10);
        if (ageNum < 18 || ageNum > 60) {
            showError(ageEl, 'Age must be between 18 and 60.');
            valid = false;
        }
    }

    if (valid) {
        showLoader();
        return true;
    }
    return false;
}
</script>

</body>
</html>
