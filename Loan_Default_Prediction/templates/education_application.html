<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Education Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="form-page-bg">

<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">LoanPredict</a>
        <div class="navbar-nav ms-auto align-items-center gap-3">
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container" style="padding-top:110px; padding-bottom:60px;">
    <div class="glass-card p-4 mx-auto" style="max-width:1000px;">
        <h3 class="text-white mb-3">Education Loan Application</h3>
        <p class="text-light">Fill the sections below and upload required documents.</p>

        <form action="/apply/education" method="POST" enctype="multipart/form-data" onsubmit="return validateApplicationForm(this)" novalidate target="_blank">
            <!-- Personal Details -->
            <h5 class="text-white mt-3">Personal Details</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-white">Student Name</label>
                    <input type="text" name="student_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Date of Birth</label>
                    <input type="date" name="dob" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Mobile Number</label>
                    <input type="tel" name="mobile" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Email ID</label>
                    <input type="email" name="email" class="form-control custom-input" required>
                </div>
                <div class="col-12">
                    <label class="text-white">Address</label>
                    <textarea name="address" class="form-control custom-input" rows="2" required></textarea>
                </div>
            </div>

            <!-- Education Details -->
            <h5 class="text-white mt-4">Education Details</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-white">College Name</label>
                    <input type="text" name="college_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Course Name</label>
                    <input type="text" name="course_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Course Duration</label>
                    <input type="text" name="course_duration" class="form-control custom-input" placeholder="e.g., 2 years" required>
                </div>
                
                <div class="col-md-4">
                    <label class="text-white">Semester</label>
                    <input type="text" name="semester" class="form-control custom-input" required>
                </div>
            </div>

            <!-- Parent/Guardian Details -->
            <h5 class="text-white mt-4">Parent / Guardian Details</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-white">Parent Name</label>
                    <input type="text" name="parent_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Occupation</label>
                    <input type="text" name="parent_occupation" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Monthly Income</label>
                    <input type="number" name="parent_income" step="0.01" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Mobile Number</label>
                    <input type="tel" name="parent_mobile" class="form-control custom-input" required>
                </div>
            </div>

            <!-- Loan Details -->
            <h5 class="text-white mt-4">Loan Details</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-white">Loan Amount Needed (₹)</label>
                    <input type="number" name="loan_amount_needed" step="0.01" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Purpose of Loan</label>
                    <input type="text" name="loan_purpose" class="form-control custom-input" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white">Repayment Period (months)</label>
                    <input type="number" name="repayment_period" class="form-control custom-input" required>
                </div>
            </div>

            <!-- Bank Details -->
            <h5 class="text-white mt-4">Bank Details</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="text-white">Bank Name</label>
                    <input type="text" name="bank_name" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Account Number</label>
                    <input type="text" name="account_number" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">IFSC Code</label>
                    <input type="text" name="ifsc" class="form-control custom-input" required>
                </div>
            </div>

            <!-- Documents Upload -->
            <h5 class="text-white mt-4">Documents Upload</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="text-white">Aadhaar Card</label>
                    <input type="file" name="aadhaar_card" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">PAN Card</label>
                    <input type="file" name="pan_card" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Passport Size Photo</label>
                    <input type="file" name="photo" accept="image/*" class="form-control custom-input" required>
                </div>

                <div class="col-md-4">
                    <label class="text-white">Fee Structure</label>
                    <input type="file" name="fee_structure" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Marks Cards / Certificates</label>
                    <input type="file" name="marks_cards" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>

                <div class="col-md-4">
                    <label class="text-white">Income Proof of Parents</label>
                    <input type="file" name="income_proof" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Bank Statement</label>
                    <input type="file" name="bank_statement" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
                <div class="col-md-4">
                    <label class="text-white">Address Proof</label>
                    <input type="file" name="address_proof" accept="image/*,application/pdf" class="form-control custom-input" required>
                </div>
            </div>

            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-glow">Submit Education Loan Application</button>
                <a href="/loan_selection" class="btn btn-outline-light ms-2">Cancel</a>
            </div>
        </form>

    </div>
</div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
